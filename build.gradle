plugins {
	id 'fabric-loom' version "${loom_version}"
}

// This branch targets the legacy 1.21.x line using Yarn mappings.
// Targets the final release of the legacy 1.21.x line.
version = "${project.mod_version}-1.21.11-fabric"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// ModMenu is distributed through the TerraformersMC maven.
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

loom {
	mods {
		"heartsplus" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ModMenu (optional at runtime, entrypoint is only used when present)
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Unit tests for the pure logic (layout, config parsing) — no game bootstrap needed.
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

jar {
	def projectName = project.base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}
