plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// NeoForge build of HeartsPlus for the legacy Minecraft 1.21.x line
// (1.21.9, Mojang mappings; jar runs on 1.21.9-1.21.10). Rendering hooks are
// identical to the Fabric branch; only the bootstrap and packaging are NeoForge.
// mod_version carries the full semver incl. build metadata: heartsplus-0.4.7+1.21.9-neoforge.jar
version = project.mod_version
group = project.maven_group

repositories {
	// Cloth Config is distributed through shedaniel's maven.
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

base {
	archivesName = project.archives_base_name
}

neoForge {
	version = project.neoforge_version

	mods {
		"heartsplus" {
			sourceSet sourceSets.main
		}
	}

	unitTest {
		// Wire the Minecraft/NeoForge classpath into the test source set:
		// HeartType and the config read game classes (Identifier, Gson).
		enable()
		testedMod = mods.heartsplus
	}
}

dependencies {
	// Cloth Config (required at runtime since 0.4.9, owns the settings screen;
	// the bundled fallback screen still exists for a cloth-less classpath).
	// The 20.x line publishes its jar under the "neoforge" classifier; ModDev
	// picks the mod jar off the classpath into the dev runtime on its own.
	implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}:neoforge"

	// Unit tests for the pure logic (layout, config parsing) — no game bootstrap needed.
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

jar {
	def projectName = project.base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}
