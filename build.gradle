plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// NeoForge build of HeartsPlus for Minecraft 26.x. mod_version carries the
// full semver incl. build metadata: heartsplus-0.4.7+26.x-neoforge.jar
version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

neoForge {
	version = project.neoforge_version

	mods {
		"heartsplus" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// Unit tests for the pure logic (layout, config parsing) — no game bootstrap needed.
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Unlike fabric-loom, ModDevGradle wires the game jars only into the main
// source set; the tests need them on the classpath for Gson and for the
// Identifier references inside HeartType.
configurations.testCompileClasspath.extendsFrom configurations.modDevCompileDependencies
configurations.testRuntimeClasspath.extendsFrom configurations.modDevRuntimeDependencies

tasks.named('test', Test) {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	def projectName = project.base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}
