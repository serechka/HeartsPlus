plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// NeoForge build of HeartsPlus for the legacy Minecraft 1.21.x line
// (1.21.2/1.21.3, Mojang mappings). Those versions still render through the
// classic LivingEntityRenderer.render path; only the bootstrap and packaging
// are NeoForge.
// mod_version carries the full semver incl. build metadata: heartsplus-0.4.8+1.21.2-neoforge.jar
version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

neoForge {
	version = project.neoforge_version

	mods {
		"heartsplus" {
			sourceSet sourceSets.main
		}
	}

	unitTest {
		// Wire the Minecraft/NeoForge classpath into the test source set:
		// HeartType and the config read game classes (Identifier, Gson).
		enable()
		testedMod = mods.heartsplus
	}
}

dependencies {
	// Unit tests for the pure logic (layout, config parsing) — no game bootstrap needed.
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

jar {
	def projectName = project.base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}
