plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// One jar covers the whole 26.x line (built against 26.2, verified on 26.1-26.3).
// mod_version carries the full semver incl. build metadata: heartsplus-0.4.7+26.x-fabric.jar
version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// ModMenu is distributed through the TerraformersMC maven.
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

loom {
	mods {
		"heartsplus" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ModMenu (optional at runtime, entrypoint is only used when present)
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Unit tests for the pure logic (layout, config parsing) — no game bootstrap needed.
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	def projectName = project.base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

loom {
	runs {
		client {
			programArgs "--quickPlaySingleplayer", "New World", "--width", "1280", "--height", "720"
		}
	}
}
