plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// NeoForge build of HeartsPlus for the legacy Minecraft 1.21.x line
// (1.21.11, Mojang mappings). Rendering hooks are identical to the
// Fabric branch; only the bootstrap and packaging are NeoForge.
version = "${project.mod_version}-1.21.11-neoforge"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

neoForge {
	version = project.neoforge_version

	mods {
		"heartsplus" {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

jar {
	def projectName = project.base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}
