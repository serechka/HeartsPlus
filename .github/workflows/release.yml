name: Release & Publish

# Builds the mod, creates a GitHub release and uploads it to Modrinth.
# Required repository secrets:
#   MODRINTH_TOKEN — Modrinth API token (modrinth.com/settings/pats)
# Trigger by pushing a tag:  git tag v1.1.1 && git push origin v1.1.1
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/heartsplus-*.jar
          generate_release_notes: true

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/heartsplus-*.jar!(*-sources.jar)
          name: HeartsPlus ${{ github.ref_name }}
          version-type: release
          loaders: fabric
          game-versions: 26.2
          dependencies: |
            fabric-api(required)
            modmenu(optional)
