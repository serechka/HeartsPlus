name: Release

# One release per mod version: builds every branch (Fabric 26.x, Fabric
# 1.21.11, NeoForge 26.x), publishes the jars to Modrinth via mc-publish,
# and creates a single GitHub release that links to the Modrinth downloads
# instead of attaching binaries.
#
# Required repository secrets:
#   MODRINTH_TOKEN - Modrinth API token with write scope
# Push a tag on main to release:  git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            mc: "26.x"
            loader: fabric
          - branch: "1.21"
            mc: "1.21.11"
            loader: fabric
          - branch: neoforge
            mc: "26.x"
            loader: neoforge
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: ./gradlew build

      - name: Strip v prefix from tag
        id: ver
        run: echo "n=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: adAcTcwa
          version: ${{ steps.ver.outputs.n }}-${{ matrix.mc }}-${{ matrix.loader }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            build/libs/heartsplus-*.jar
            !build/libs/*-sources.jar
          name: HeartsPlus ${{ github.ref_name }} (${{ matrix.mc }} ${{ matrix.loader }})
          version-type: beta
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc == '26.x' && '26.1, 26.2, 26.3' || matrix.mc }}
          dependencies: ${{ matrix.loader == 'fabric' && 'fabric-api(required)' || '' }}

      - name: Upload branch artifact
        uses: actions/upload-artifact@v4
        with:
          name: heartsplus-${{ matrix.mc }}-${{ matrix.loader }}
          path: |
            build/libs/heartsplus-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: build-and-publish
    permissions:
      contents: write
    steps:
      - name: Compute bare version number
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with Modrinth download links
        uses: softprops/action-gh-release@v2
        with:
          name: HeartsPlus ${{ github.ref_name }} (beta)
          body: |
            Beta build. Downloads are hosted on Modrinth:

            - [Fabric, Minecraft 26.1-26.3](https://modrinth.com/mod/heartsplus/version/${{ steps.version.outputs.number }}-26.x-fabric)
            - [Fabric, Minecraft 1.21.11](https://modrinth.com/mod/heartsplus/version/${{ steps.version.outputs.number }}-1.21.11-fabric)
            - [NeoForge, Minecraft 26.1-26.3](https://modrinth.com/mod/heartsplus/version/${{ steps.version.outputs.number }}-26.x-neoforge)
          generate_release_notes: false
          prerelease: true
