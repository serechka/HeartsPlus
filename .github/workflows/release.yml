name: Release

# A tag triggers a GitHub Release that links to the Modrinth downloads
# instead of attaching binaries. The 14 Modrinth lines (7 render eras x
# 2 loaders) are published manually through the Modrinth API - see
# HANDOFF section 5 for the recipe and DECISIONS #26 for the pitfalls
# (Modrinth accepts duplicate version numbers, so check GET before POST).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release with a Modrinth link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --verify-tag             --title "HeartsPlus ${TAG#v}"             --notes "Download the mod for your loader and game version on Modrinth: https://modrinth.com/mod/heartsplus

Full changelog: https://modrinth.com/mod/heartsplus/changelog"
